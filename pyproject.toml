[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ti-companion-plus"
version = "0.1.0"
description = "TI Companion Plus, a spinoff of b4p3p's Terra Invicta Companion: a second-screen companion for Terra Invicta that reads your save file and shows council, missions and nations while you play."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "joesco726" }, { name = "b4p3p" }]
keywords = ["terra-invicta", "gaming", "companion", "savegame", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "watchfiles>=0.21",           # riavvio dell'API in sviluppo, vedi start.ps1
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Le icone sono gia' in assets/icons/. Questo extra serve solo a ri-estrarle
# dai bundle Unity dell'installazione locale, se mancassero.
icons = ["UnityPy>=1.20", "Pillow>=10"]

[project.urls]
Homepage = "https://github.com/joesco726/ti-companion-plus"
Issues = "https://github.com/joesco726/ti-companion-plus/issues"

[project.scripts]
ti = "ti:main"

[tool.setuptools]
packages = ["ticore", "tiserver"]
py-modules = ["ti"]
